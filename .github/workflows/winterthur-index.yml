name: Winterthur index

# Saves a searchable index of Winterthur Museum textiles and rug-related objects to
# data/winterthur-index.json, which the Discover view searches (Winterthur's own search
# can't be called from other websites). Weekly, and on demand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      titles:
        description: "How many object pages to read for full titles this run"
        required: false
        default: "1500"
  schedule:
    - cron: "41 7 * * 2"

permissions:
  contents: write

concurrency:
  group: winterthur-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build index and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          node scripts/winterthur-index.mjs --titles "${{ inputs.titles || '1500' }}"
          cp data/winterthur-index.json "${RUNNER_TEMP}/winterthur-index.json"
          for attempt in 1 2 3; do
            git add data/winterthur-index.json
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -q -m "Update the Winterthur index"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            # Someone else pushed: take their branch and lay this run's index on top.
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
            cp "${RUNNER_TEMP}/winterthur-index.json" data/winterthur-index.json
          done
          exit 1
