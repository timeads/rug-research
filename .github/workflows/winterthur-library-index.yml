name: Winterthur library index

# Saves a searchable index of the Winterthur Library digital collections to
# data/winterthur-library-index.json, which the Discover view searches (the collections site
# has no search API). Weekly, and on demand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      details:
        description: "How many document pages to read for full details this run"
        required: false
        default: "1500"
  schedule:
    - cron: "53 8 * * 2"

permissions:
  contents: write

concurrency:
  group: winterthur-library-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build index and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          node scripts/winterthur-library-index.mjs --details "${{ inputs.details || '1500' }}"
          cp data/winterthur-library-index.json "${RUNNER_TEMP}/winterthur-library-index.json"
          for attempt in 1 2 3; do
            git add data/winterthur-library-index.json
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -q -m "Update the Winterthur library index"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            # Someone else pushed: take their branch and lay this run's index on top.
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
            cp "${RUNNER_TEMP}/winterthur-library-index.json" data/winterthur-library-index.json
          done
          exit 1
