name: Site screenshots

# Photographs the live public site (research/site-shots/) to check its pictures by eye. On demand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-screenshots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Take the screenshots and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          node scripts/site-screenshots.mjs
          mkdir -p "${RUNNER_TEMP}/out" && cp research/site-shots/* "${RUNNER_TEMP}/out/"
          for attempt in 1 2 3; do
            git add research/site-shots
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -q -m "Save site screenshots"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
            mkdir -p research/site-shots && cp "${RUNNER_TEMP}/out/"* research/site-shots/
          done
          exit 1
