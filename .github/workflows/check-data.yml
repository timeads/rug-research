name: Check data

# Fails if a data file doesn't parse, an id repeats, a chapter links to a missing
# record, or a local image is missing, so a broken edit is caught before readers see it.
on:
  push:
    paths: ["data/**", "images/**", "scripts/check-data.cjs"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-data.cjs
