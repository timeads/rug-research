name: Relink check

# Checks candidate new addresses for broken record links (research/relink-candidates.json)
# and the Internet Archive copy of each original. On demand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relink-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links and commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          node scripts/check-candidates.mjs
          mkdir -p "${RUNNER_TEMP}/out" && cp research/fetched/relink-results.json "${RUNNER_TEMP}/out/"
          for attempt in 1 2 3; do
            git add research/fetched/relink-results.json
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -q -m "Save relink check results"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
            cp "${RUNNER_TEMP}/out/relink-results.json" research/fetched/
          done
          exit 1
