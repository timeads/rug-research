name: Access check

# Checks every Other archives link and record source link: which still work, which have moved or
# gone, and which sites block automated tools. Writes research/access-check.md. Monthly, and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 10 3 * *"

permissions:
  contents: write

concurrency:
  group: access-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links and commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          node scripts/check-access.mjs
          cat research/access-check.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "${RUNNER_TEMP}/out" && cp research/access-check.md research/fetched/access-check.json "${RUNNER_TEMP}/out/"
          for attempt in 1 2 3; do
            git add research/access-check.md research/fetched/access-check.json
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -q -m "Update the access check"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
            cp "${RUNNER_TEMP}/out/access-check.md" research/ && cp "${RUNNER_TEMP}/out/access-check.json" research/fetched/
          done
          exit 1
