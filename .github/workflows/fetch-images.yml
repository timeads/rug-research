name: Fetch images

# Looks up real museum/library images for records that don't have one and
# commits the image links back to data/items.js.
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-check images that were found automatically before"
        type: boolean
        default: false
  push:
    paths: ["data/items.js"]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # latest branch state, not the commit that queued this run
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look up images
        env:
          IMAGE_CACHE: ${{ runner.temp }}/image-cache.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          # The data file may change while this runs (people or other jobs push). On a
          # rejected push, start again from the latest version; the script skips work already done.
          for attempt in 1 2 3; do
            node scripts/fetch-images.mjs ${{ inputs.refresh && '--refresh' || '' }}
            git add data/items.js
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -q -m "Add image links found by image lookup"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD  # checkout creates no origin/<branch> ref
          done
          exit 1
