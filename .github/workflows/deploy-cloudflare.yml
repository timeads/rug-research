name: Publish to Cloudflare

# Builds A History of Tufted Rugs for its own domain and publishes it to Cloudflare Pages (project
# "historyoftuftedrugs"), then makes sure www.historyoftuftedrugs.com and historyoftuftedrugs.com point at it
# (scripts/cloudflare-setup.sh). Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: ["claude/ecstatic-hamilton-gw4o0u"]
    paths: ["site/**", "data/**", "images/**", "scripts/cloudflare-setup.sh", ".github/workflows/deploy-cloudflare.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

env:
  PROJECT: historyoftuftedrugs
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Cloudflare secrets
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; nothing published."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build for the domain
        if: steps.ready.outputs.go == 'true'
        working-directory: site
        env:
          CF_PAGES: "1"
        run: |
          npm ci
          npm run build
      - name: Create the Pages project (first run only)
        if: steps.ready.outputs.go == 'true'
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || echo "Project already exists."
      - name: Publish
        if: steps.ready.outputs.go == 'true'
        run: npx --yes wrangler@4 pages deploy site/dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true
      - name: Domains, DNS and the redirect to www
        if: steps.ready.outputs.go == 'true'
        run: bash scripts/cloudflare-setup.sh
