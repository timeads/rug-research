name: API probe

# Records which collection APIs allow browser (CORS) requests, with a sample response each.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node scripts/probe-apis.mjs
            git add research/fetched/api-probe.json
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -q -m "Save API probe results"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
          done
          exit 1
