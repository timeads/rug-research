name: Image audit

# Lays out automatically found images on labelled contact sheets (research/fetched/image-audit-N.png)
# so they can be checked by eye. On demand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Make the sheets and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          node scripts/image-audit.mjs
          mkdir -p "${RUNNER_TEMP}/out" && cp research/fetched/image-audit* "${RUNNER_TEMP}/out/"
          for attempt in 1 2 3; do
            git add research/fetched/image-audit*
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -q -m "Save image audit sheets"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
            cp "${RUNNER_TEMP}/out/"* research/fetched/
          done
          exit 1
